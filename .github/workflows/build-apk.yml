name: Build Pixel Double Tap APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PixelDoubleTap-AndroidStudio-Project.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q PixelDoubleTap-AndroidStudio-Project.zip -d .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: PixelDoubleTap
        run: gradle assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Double-Tap-APK
          path: PixelDoubleTap/app/build/outputs/apk/debug/app-debug.apk

          
